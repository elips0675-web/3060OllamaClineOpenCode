name: swiftmatch-local
version: 1.0.0
schema: v1

models:
  - name: Qwen2.5-Coder 14B (локально, чат и правки)
    provider: ollama
    model: swiftmatch-coder-14b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 12288
      maxTokens: 2048

  - name: Qwen2.5-Coder 1.5B (локально, автодополнение)
    provider: ollama
    model: swiftmatch-coder-tiny
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    defaultCompletionOptions:
      contextLength: 4096
      maxTokens: 128
    # Проверено 02.11.2026: Tab принимает подсказку этой модели — Continue 2.0.0
    # пишет "accepted":true в ~/.continue/dev_data/0.2.0/autocomplete.jsonl, а
    # 14B остаётся в VRAM (ollama ps: 14B 9.97 ГБ + tiny 1.11 ГБ).
    # Ключ autocompleteOptions схема config.yaml не поддерживает — не дописывать;
    # параметры Tab (debounce, multiline) задаются в UI расширения.

  - name: Qwen2.5-Coder 7B (замена 14B, только когда 14B выгружен)
    provider: ollama
    # если ставили пункт [5] (7B q5_K_M), здесь нужен swiftmatch-coder-7b-q5
    model: swiftmatch-coder-7b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 16384
      maxTokens: 128

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: problems

# multiline-подсказки в схеме config.yaml отсутствуют: это настройка IDE
# (Continue → Settings → Tab Autocomplete), а не поле конфига. Не дописываем
# сюда ключ, которого схема не знает.

# docs: НЕ добавлять. С url file:///... (даже на существующий файл) Continue
# 2.0.0 показывает в строке состояния «Continue (config error)» и не запрашивает
# автодополнение вовсе — проверено 02.11.2026, ошибка уходит сразу после удаления
# блока. Правила проекта читаются из AGENTS.md в корне проекта.


